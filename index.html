<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Seven Hills Clinical AI</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#18343e;background:#edf3f4}header{background:#173c43;color:white;padding:22px 5%}header h1{margin:5px 0}main{max-width:1180px;margin:auto;padding:20px}button{background:#216b65;color:white;border:0;border-radius:8px;padding:11px 17px;font:inherit;cursor:pointer}button:disabled{opacity:.5}input,select,textarea{font:inherit;border:1px solid #aabdc3;border-radius:7px;padding:10px;width:100%;background:white}input[type=checkbox]{width:auto}textarea{min-height:100px}label{display:block;margin:10px 0}label span{display:block;margin-bottom:5px}section,aside{background:white;padding:22px;border-radius:14px;margin-bottom:16px}h2,h3{margin-top:0}small{letter-spacing:1px}pre{white-space:pre-wrap;font:inherit}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px}.patient{display:block;width:100%;text-align:left;margin:8px 0;background:#e5efed;color:#173c43}.patient.active{background:#216b65;color:white}.muted{color:#536a73}.notice{background:#fff5df;padding:12px;border-radius:8px}[hidden]{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style><header><small>DEVELOPMENT · v0.7.3</small><h1>Seven Hills Clinical AI</h1>Clinical documentation workspace</header><main><p class="notice">Fictional patients only. Not for clinical use. Profiles and assessments disappear on refresh or sign-out.</p><p id="status" role="status">Checking session…</p><button id="login" hidden>Sign in</button><button id="logout" hidden>Sign out</button><div id="workspace" hidden><div class="layout"><aside><h2>Patient directory</h2><div id="patients"></div><button id="new">New fictional patient</button></aside><div><section id="profile" hidden><h2>Admission profile</h2><form id="profileForm"><div class="fields"><label><span>Fictional patient label</span><input id="name" required maxlength="60"></label><label><span>Age</span><input id="age" type="number" min="0" max="120" required></label><label><span>Sex</span><select id="sex"><option>Female</option><option>Male</option><option>Not specified</option></select></label><label><span>Primary diagnosis</span><input id="diagnosis" required maxlength="150" list="diagnoses"><datalist id="diagnoses"><option>Alzheimer disease</option><option>Heart failure</option><option>Chronic respiratory failure</option><option>Protein calorie malnutrition</option><option>Cancer</option></datalist></label></div><label><span>Comorbidities (comma separated, or enter None)</span><input id="comorbidities" required maxlength="500"></label><button>Save temporary profile</button></form></section><section id="visit"><h2 id="patientTitle">Assessment</h2><p id="summary" class="muted"></p><div class="fields"><label><span>Visit type</span><select id="visitType"><option>Admission</option><option>Routine nursing visit</option><option>PRN visit</option><option selected>Recertification</option></select></label><label><span>Benefit period</span><input id="bp" type="number" min="1" max="100" value="4"></label><label><span>Current PPS (%)</span><select id="pps"></select></label><label><span>Previous PPS (%)</span><select id="prior"></select></label></div><p id="guidance" class="notice"></p><div id="clinical" class="fields"></div><p id="comparison" class="muted"></p><p id="history" class="notice" hidden></p><div id="savedVisits" aria-live="polite"></div><div class="fields"><label><span>Function / ADLs</span><textarea id="function"></textarea></label><label><span>Nutrition / weight / MAC</span><textarea id="nutrition"></textarea></label><label><span>Symptoms / disease findings</span><textarea id="symptoms"></textarea></label><label><span>Interventions and response</span><textarea id="interventions"></textarea></label></div><label><span>Additional assessment and historical comparisons</span><textarea id="assessment"></textarea></label><label><input type="checkbox" id="confirm"> I confirm this contains fictional information only.</label><button id="review">Review assessment</button><section id="result" aria-live="polite"></section></section></div></div></div></main><script src="app.js" defer></script></html>
