name: Offline synthetic tests and release packages
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and mocked unit tests
        run: |
          python3 -m py_compile lambda_function.py patient_store.py build_release.py
          python3 -m unittest discover -s tests -v
      - name: Frontend syntax and static DOM bindings
        run: |
          node --check app.js
          python3 -c "import re,pathlib; a=pathlib.Path('app.js').read_text(); h=pathlib.Path('index.html').read_text(); missing=set(re.findall(r\"\\$\\('([^']+)'\\)\",a))-set(re.findall(r'id=\"([^\"]+)\"',h)); assert not missing,missing"
      - name: Build deployment packages
        run: python3 build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: seven-hills-v0.8.0-development
          path: dist/*.zip
          retention-days: 7
